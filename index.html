<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>마음약국 우울·스트레스 자가진단</title>
  <!-- 📱 모바일 최적화 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    /* ===== 전체 배경: 크리스마스 느낌 (눈 내리는 듯한 그라디언트) ===== */
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      background:
        radial-gradient(circle at 10% 20%, rgba(255,255,255,0.4) 0, transparent 40%),
        radial-gradient(circle at 90% 10%, rgba(255,255,255,0.25) 0, transparent 45%),
        radial-gradient(circle at 20% 90%, rgba(255,255,255,0.35) 0, transparent 40%),
        linear-gradient(135deg, #0f172a 0%, #1e293b 40%, #14532d 100%);
      background-attachment: fixed;
    }

    /* ===== 설문 카드 영역 ===== */
    .container {
      max-width: 720px;
      margin: 20px auto;
      background: rgba(255, 255, 255, 0.97);
      padding: 22px 16px 30px;
      border-radius: 18px;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.45);
      position: relative;
      overflow: hidden;
      border: 2px solid rgba(220, 38, 38, 0.18); /* 약한 레드 보더 */
    }

    /* 카드 상단 크리스마스 장식 띠 */
    .container::before {
      content: "";
      position: absolute;
      inset: 0;
      height: 6px;
      background: linear-gradient(90deg, #dc2626, #f97316, #facc15, #22c55e, #22d3ee, #a855f7);
      opacity: 0.9;
    }

    /* 카드 모서리 포인트 (크리스마스 리본 느낌) */
    .container::after {
      content: "";
      position: absolute;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(248, 250, 252, 0.9), transparent 60%);
      top: -40px;
      right: -40px;
      opacity: 0.7;
      pointer-events: none;
    }

    h1 {
      text-align: center;
      font-size: 22px;
      margin-top: 14px;
      margin-bottom: 6px;
      color: #14532d; /* 짙은 초록 */
    }

    .subtitle {
      text-align: center;
      font-size: 13px;
      color: #374151;
      margin-bottom: 18px;
    }

    /* 척도 안내 영역도 살짝 크리스마스 테두리 */
    .scale-guide {
      font-size: 13px;
      color: #111827;
      background: #f9fafb;
      padding: 10px 12px;
      border-radius: 12px;
      margin-bottom: 18px;
      border-left: 4px solid #22c55e;
      border-right: 4px solid #dc2626;
    }

    .question {
      margin-bottom: 16px;
      padding: 10px 8px 12px;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
      background: #f9fafb;
    }

    .question-text {
      font-size: 14px;
      margin-bottom: 8px;
      font-weight: 500;
      color: #111827;
      line-height: 1.5;
    }

    .scale-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 12px;
      align-items: center;
    }

    /* 버튼(척도 점수) – 크리스마스 컬러 캡슐 */
    .scale-option {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 8px 12px;
      border-radius: 999px;
      background: #eef2ff;
      cursor: pointer;
      border: 1px solid #e5e7eb;
      transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.1s ease;
    }

    .scale-option span {
      font-weight: 600;
      color: #111827;
    }

    .scale-option input[type="radio"] {
      margin: 0;
      transform: scale(1.2); /* 모바일에서 손가락으로 누르기 쉽게 */
      accent-color: #22c55e; /* 체크 색 초록 */
    }

    .scale-option:hover {
      transform: translateY(-1px);
      box-shadow: 0 3px 6px rgba(15, 23, 42, 0.18);
      background: #e0f2fe;
    }

    button {
      width: 100%;
      margin-top: 16px;
      padding: 14px 0;
      background: linear-gradient(135deg, #dc2626, #16a34a);
      border: none;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 700;
      color: white;
      cursor: pointer;
      box-shadow: 0 8px 16px rgba(220, 38, 38, 0.35);
      letter-spacing: 0.03em;
    }

    button:hover {
      opacity: 0.97;
      transform: translateY(-1px);
      box-shadow: 0 10px 20px rgba(22, 163, 74, 0.4);
    }

    .result {
      margin-top: 22px;
      padding: 16px 14px 18px;
      border-radius: 16px;
      background: rgba(248, 250, 252, 0.98);
      border: 1px solid rgba(15, 23, 42, 0.08);
      box-shadow: 0 10px 20px rgba(15, 23, 42, 0.25);
      display: none;
      position: relative;
      overflow: hidden;
    }

    /* 결과 카드에도 은은한 눈/별 장식 */
    .result::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle at 10% 20%, rgba(209, 250, 229, 0.7) 0, transparent 55%),
        radial-gradient(circle at 80% 10%, rgba(254, 226, 226, 0.7) 0, transparent 60%);
      opacity: 0.6;
      pointer-events: none;
    }

    .result-inner {
      position: relative;
      z-index: 1;
    }

    .result-title {
      font-weight: 800;
      font-size: 17px;
      margin-bottom: 8px;
      color: #b91c1c;
    }

    .result-score {
      font-size: 14px;
      margin-bottom: 10px;
      color: #1f2937;
    }

    .result-body {
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-line;
      color: #111827;
    }

    /* ===== 모바일 최적화 반응형 ===== */
    @media (max-width: 480px) {
      .container {
        margin: 10px;
        padding: 18px 14px 24px;
        border-radius: 16px;
      }
      h1 {
        font-size: 19px;
      }
      .subtitle {
        font-size: 12px;
      }
      .question-text {
        font-size: 13px;
      }
      .scale-option {
        padding: 6px 10px;
        font-size: 12px;
      }
      button {
        font-size: 15px;
        padding: 12px 0;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>마음약국 우울·스트레스 자가진단</h1>
    <p class="subtitle">지난 2주 동안의 상태를 기준으로 가장 가까운 점수를 선택하세요.</p>

    <div class="scale-guide">
      ⬤ 척도 안내<br>
      1점: 전혀 아니다 ｜  
      2점: 약간 ｜  
      3점: 가끔 ｜  
      4점: 자주 ｜  
      5점: 거의 항상
    </div>

    <form id="scaleForm">

      <!-- 문항 텍스트 (기존 내용 그대로) -->
      <script>
        const questionsText = [
          "최근 2주 동안 우울하거나 슬픈 기분이 지속되었다.",
          "평소 즐겁던 활동이나 취미에서 흥미가 크게 줄었다.",
          "피곤함이 쉽게 느껴지고 에너지가 부족했다.",
          "잠을 잘 못 자거나, 평소보다 과하게 잤다.",
          "식욕이 줄거나 반대로 과식이 늘었다.",
          "스스로에 대한 부정적인 생각이 자주 들었다.",
          "학교생활·과제·일상 활동을 하는 데 집중이 어려웠다.",
          "불안하고 초조한 느낌이 자주 들었다.",
          "사소한 일에도 쉽게 짜증이 나거나 예민해졌다.",
          "주변 사람들과의 관계가 부담스럽거나 피하고 싶었다.",
          "미래에 대해 비관적인 생각이 들었다.",
          "몸이 무겁고 행동이 느려진 것 같은 느낌이 있었다.",
          "이유 없이 눈물이 나려고 했다.",
          "공부나 일상 수행에 자신감이 줄었다.",
          "혼자 있고 싶거나 사회적 활동을 피하게 되었다.",
          "마음이 공허하고 아무 감정이 없는 듯한 느낌이 들었다.",
          "결정해야 할 일이 있을 때 평소보다 어렵게 느껴졌다.",
          "죄책감이나 쓸모없다는 느낌이 들었다.",
          "스트레스를 견디는 능력이 떨어졌다고 느꼈다.",
          "삶의 의미나 목적에 대해 회의감이 들었다."
        ];
      </script>

      <div id="questionArea"></div>

      <button type="submit">진단하기 💊</button>
    </form>

    <div id="resultBox" class="result">
      <div class="result-inner">
        <div id="resultTitle" class="result-title"></div>
        <div id="resultScore" class="result-score"></div>
        <div id="resultBody" class="result-body"></div>
      </div>
    </div>
  </div>

  <script>
    /* ===== 질문 HTML 자동 생성 (텍스트는 그대로 사용) ===== */
    const qArea = document.getElementById("questionArea");
    for (let i = 0; i < questionsText.length; i++) {
      const idx = i + 1;
      qArea.innerHTML += `
        <div class="question">
          <div class="question-text">${idx}. ${questionsText[i]}</div>
          <div class="scale-row">
            ${[1,2,3,4,5].map(n => `
              <label class="scale-option">
                <input type="radio" name="q${idx}" value="${n}">
                <span>${n}</span>
              </label>
            `).join("")}
          </div>
        </div>
      `;
    }

    /* ===== 결과 처방 문구 (기존 내용 그대로) ===== */
    const resultText = {
      mild: {
        title: "마데카솔 단계 (20~39점)",
        body: 
`● 상태
- 정상 또는 경미한 스트레스 수준
- 일상적인 대학생활 스트레스 범위
- 휴식과 생활습관 조절로 충분히 개선 가능

● 처방(마데카솔)
가벼운 마음 상처에 바르는 연고 같은 수준!
생활조절·휴식만으로도 회복 가능하며,
규칙적인 수면, 햇빛, 산책이 특히 효과적입니다.`
      },
      moderate: {
        title: "타이레놀 단계 (40~59점)",
        body:
`● 상태
- 경도 우울 가능성
- 학업 스트레스·대인관계 문제와 결합될 수 있음
- 집중력 저하·기분 변화가 체감될 가능성 있음

● 처방(타이레놀)
마음 통증이 있는 상태!
학교 상담센터·지역 상담기관 방문 권장.
운동·수면·생활 리듬 조정이 큰 도움이 됩니다.`
      },
      severeMid: {
        title: "게보린 단계 – 중등도 우울 (60~79점)",
        body:
`● 상태
- 대학생에게 흔히 나타나는 중등도 우울
- 집중력 저하, 무기력, 감정 저하가 뚜렷하게 나타나는 단계
- 공부·대인관계에 실제 영향 가능

● 처방(게보린)
타이레놀보다 ‘더 강한 마음약’이 필요한 단계!
전문 상담 적극 권장.
상담센터·정신건강복지센터 연계가 큰 도움을 줄 수 있습니다.`
      },
      severeHigh: {
        title: "게보린 단계 – 중증 우울 (80~100점)",
        body:
`● 상태
- 강한 무기력, 자기비난, 감정 저하가 두드러짐
- 일상 기능 저하가 나타날 가능성 매우 큼

● 처방(게보린)
즉각적인 전문기관 상담 필요!
- 학교 상담센터
- 정신건강복지센터
- 정신건강의학과 진료
정서적 고통을 혼자 견디지 않아도 됩니다.`
      }
    };

    /* ===== 점수 계산 및 결과 표시 ===== */
    document.getElementById("scaleForm").addEventListener("submit", function (e) {
      e.preventDefault();

      let sum = 0;
      const totalQ = 20;

      for (let i = 1; i <= totalQ; i++) {
        const selected = document.querySelector(`input[name="q${i}"]:checked`);
        if (!selected) {
          alert(`${i}번 문항에 응답해주세요.`);
          return;
        }
        sum += Number(selected.value);
      }

      let result;
      if (sum <= 39) result = resultText.mild;
      else if (sum <= 59) result = resultText.moderate;
      else if (sum <= 79) result = resultText.severeMid;
      else result = resultText.severeHigh;

      document.getElementById("resultTitle").textContent = result.title;
      document.getElementById("resultScore").textContent = `총점: ${sum}점 / 20~100점`;
      document.getElementById("resultBody").textContent = result.body;

      const box = document.getElementById("resultBox");
      box.style.display = "block";
      box.scrollIntoView({ behavior: "smooth" });
    });
  </script>

</body>
</html>
